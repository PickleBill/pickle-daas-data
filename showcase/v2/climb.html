<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Bill Bricker — The Climb</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --paper:#efe3c4;--paper2:#e6d6a8;--vellum:#f5ebd0;--sky:#f7eed5;
    --ink:#2b1f10;--ink2:#4a3a1f;--mute:#7a6a48;--faint:rgba(43,31,16,.3);
    --rule:rgba(43,31,16,.16);--sienna:#a8421d;--sienna-deep:#6e2a12;
    --ochre:#d68a2a;--moss:#5e7a2a;--river:#2b4a6f;
    --hand:"Caveat",cursive;--serif:"Spectral",Georgia,serif;--mono:"JetBrains Mono",monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--serif);line-height:1.55;
    background:radial-gradient(ellipse at 30% 0%, var(--sky) 0%, var(--paper) 55%, var(--paper2) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.18  0 0 0 0 0.13  0 0 0 0 0.06  0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    background-blend-mode:multiply;background-attachment:fixed}
  ::selection{background:var(--ink);color:var(--paper)}
  a{color:inherit}
  .wrap{max-width:880px;margin:0 auto;padding:0 22px}

  /* ===== consistent nav ===== */
  nav{position:sticky;top:0;z-index:50;background:rgba(245,238,213,.9);backdrop-filter:blur(8px);border-bottom:.5px solid var(--rule)}
  nav .wrap{max-width:1060px;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 22px}
  .brand{font-style:italic;font-weight:500;font-size:19px;text-decoration:none}
  .nl{display:flex;gap:20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
  .nl a{color:var(--mute);text-decoration:none;transition:.15s;padding:4px 0;border-bottom:1.5px solid transparent}
  .nl a:hover{color:var(--sienna)}
  .nl a.here{color:var(--ink);border-bottom-color:var(--sienna)}
  .nl a.email{border:.5px solid var(--ink);border-bottom-width:.5px;padding:6px 12px;color:var(--ink)}
  .nl a.email:hover{background:var(--ink);color:var(--paper)}
  @media(max-width:640px){.nl{gap:12px;font-size:9px}.nl a.email{padding:5px 9px}}

  /* ===== hero ===== */
  header{padding:54px 0 8px;text-align:center}
  .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
  h1{font-style:italic;font-weight:300;font-size:clamp(40px,9vw,72px);line-height:.95;letter-spacing:-.025em;margin:12px 0 0}
  h1 em{font-style:normal;color:var(--sienna)}
  .deck{font-size:clamp(15px,3.6vw,18px);font-style:italic;color:var(--ink2);max-width:46ch;margin:18px auto 0;line-height:1.45}
  .scrollcue{font-family:var(--hand);color:var(--sienna);font-size:20px;margin-top:24px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

  /* ===== timeline ===== */
  .tl{position:relative;margin:36px auto 20px;max-width:760px;padding:10px 0 40px}
  .tl::before{content:"";position:absolute;top:0;bottom:0;left:38px;width:2px;
    background:linear-gradient(180deg,var(--sienna),var(--ochre) 40%,var(--rule));border-radius:2px}
  @media(min-width:760px){.tl::before{left:50%;transform:translateX(-50%)}}

  .row{position:relative;padding:0 0 26px 84px;min-height:64px}
  @media(min-width:760px){
    .row{width:50%;padding:0;margin-bottom:30px;min-height:0}
    .row.r{margin-left:50%;padding-left:62px}
    .row.l{padding-right:62px;text-align:right}
  }

  /* medallion */
  .med{position:absolute;left:8px;top:0;width:62px;height:62px;cursor:pointer;z-index:2}
  @media(min-width:760px){
    .row.r .med{left:-31px}
    .row.l .med{left:auto;right:-31px}
  }
  .med .ring{position:absolute;inset:0;border-radius:50%;background:var(--vellum);
    border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(43,31,16,.18);transition:transform .25s, box-shadow .25s;overflow:hidden}
  .med .mono{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:-.02em;color:var(--ink)}
  .med .gly{font-size:24px;line-height:1}
  .med::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--sienna);
    opacity:0;animation:halo 2.8s ease-in-out infinite}
  @keyframes halo{0%,100%{opacity:0;transform:scale(.9)}50%{opacity:.45;transform:scale(1.05)}}
  .med:hover .ring{transform:scale(1.12);box-shadow:0 6px 18px rgba(168,66,29,.3)}

  .med.career .ring{border-color:var(--ink)}
  .med.side .ring{border-color:var(--ochre);background:#f7eecb}
  .med.side .mono{color:var(--sienna-deep)}
  .med.personal .ring{border-color:var(--moss)}
  .med.personal .mono{color:var(--moss)}
  .med.live .ring{border-color:var(--sienna);background:var(--vellum)}
  .med.live .mono{color:var(--sienna)}
  .med.live::after{border-color:var(--sienna);animation:haloLive 2s ease-in-out infinite}
  @keyframes haloLive{0%,100%{opacity:.2;transform:scale(.92);box-shadow:0 0 0 0 rgba(168,66,29,.35)}
    50%{opacity:.8;transform:scale(1.12);box-shadow:0 0 26px 4px rgba(168,66,29,.25)}}

  /* card stub on the timeline */
  .stub{cursor:pointer;display:inline-block;max-width:100%}
  .stub .yr{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute)}
  .stub .live-pill{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;
    background:var(--sienna);color:var(--paper);padding:1px 7px;margin-left:7px;vertical-align:1.5px;text-transform:uppercase}
  .stub h3{font-style:italic;font-weight:500;font-size:21px;letter-spacing:-.01em;margin:2px 0 3px;line-height:1.05}
  .stub .one{font-size:13.5px;color:var(--ink2);line-height:1.4;max-width:42ch}
  @media(min-width:760px){.row.l .stub .one{margin-left:auto}}
  .stub .tap{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sienna);margin-top:7px;display:inline-block}
  .stub:hover .tap{text-decoration:underline;text-underline-offset:3px}
  .stub:hover h3{color:var(--sienna)}

  .row{opacity:0;transform:translateY(20px);transition:.6s cubic-bezier(.16,1,.3,1)}
  .row.in{opacity:1;transform:none}
  .no-js .row{opacity:1;transform:none}

  .climbfoot{text-align:center;padding:24px 0 70px}
  .climbfoot .hand{font-family:var(--hand);color:var(--sienna);font-size:24px}
  .climbfoot .ctas{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:18px}
  .btn{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    padding:11px 18px;border:.5px solid var(--ink);color:var(--ink);text-decoration:none;transition:.15s}
  .btn:hover{background:var(--vellum)}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.primary:hover{background:var(--sienna);border-color:var(--sienna)}

  /* ===== card overlay (bottom-sheet on mobile) ===== */
  .scrim{position:fixed;inset:0;z-index:80;background:rgba(43,31,16,.46);backdrop-filter:blur(2px);
    display:none;align-items:flex-end;justify-content:center;padding:0}
  .scrim.on{display:flex}
  @media(min-width:640px){.scrim{align-items:center;padding:24px}}
  .card{width:min(560px,100%);max-height:88vh;overflow:auto;
    background:linear-gradient(180deg,#f7eed5,#efe2bf);
    border:.5px solid var(--ink);box-shadow:0 -10px 40px rgba(43,31,16,.4);
    padding:30px 24px 26px;position:relative;animation:up .3s cubic-bezier(.3,.7,.4,1)}
  @media(min-width:640px){.card{border-radius:2px;box-shadow:0 18px 50px rgba(43,31,16,.4)}}
  @keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
  .card .tape{position:absolute;top:-11px;left:50%;width:90px;height:20px;transform:translateX(-50%) rotate(-2deg);
    background:repeating-linear-gradient(90deg,rgba(214,138,42,.7) 0 5px,rgba(214,138,42,.45) 5px 9px)}
  .card .close{position:absolute;top:12px;right:16px;background:none;border:none;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .card .close:hover{color:var(--sienna)}
  .card .emblem{display:flex;align-items:center;gap:12px;margin-bottom:2px}
  .card .emblem .e{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:13px;flex-shrink:0}
  .card .emblem .e .gly{font-size:22px}
  .card .lane{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .card h2{font-style:italic;font-weight:500;font-size:32px;line-height:1.02;letter-spacing:-.02em;margin:8px 0 4px}
  .card .period{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sienna);margin-bottom:14px}
  .card .pull{font-style:italic;font-size:18px;line-height:1.35;border-left:2px solid var(--sienna);padding:3px 0 3px 14px;margin:6px 0 16px}
  .card p{font-size:14.5px;color:var(--ink2);line-height:1.6;margin:0 0 11px}
  .card p em{font-style:italic;color:var(--ink)}
  .card .actions{margin-top:16px;padding-top:13px;border-top:.5px dotted var(--rule);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .card .actions a.lnk{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--sienna);text-decoration:underline;text-underline-offset:3px}
  .card .nav-btns{display:flex;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
  .card .nav-btns button{background:none;border:none;cursor:pointer;color:inherit;font:inherit;padding:0}
  .card .nav-btns button:hover{color:var(--sienna)}
</style>
</head>
<body class="no-js">

<nav><div class="wrap">
  <a class="brand" href="index.html">Bill Bricker</a>
  <div class="nl">
    <a href="index.html">Home</a>
    <a href="climb.html" class="here">Story</a>
    <a href="work.html">Work</a>
    <a href="resume.html">Résumé</a>
    <a href="mailto:bricker3@gmail.com" class="email">Email</a>
  </div>
</div></nav>

<header><div class="wrap">
  <div class="eyebrow">2006 → now · still rising</div>
  <h1>The <em>Climb</em></h1>
  <p class="deck">Twenty years of selling, shipping, and introducing — told as one ascent. Tap any marker to read its story.</p>
  <div class="scrollcue">↓</div>
</div></header>

<div class="wrap"><div class="tl" id="tl"></div></div>

<div class="climbfoot">
  <div class="hand">summit unset. still walking ↗</div>
  <div class="ctas">
    <a class="btn primary" href="work.html">See the work →</a>
    <a class="btn" href="resume.html">Résumé</a>
    <a class="btn" href="mailto:bricker3@gmail.com">Email Bill</a>
  </div>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeCard()">
  <article class="card">
    <span class="tape"></span>
    <button class="close" onclick="closeCard()">close ✕</button>
    <div class="emblem"><span class="e" id="cE"></span><div><div class="lane" id="cLane"></div></div></div>
    <h2 id="cTitle"></h2>
    <div class="period" id="cPeriod"></div>
    <div class="pull" id="cPull"></div>
    <div id="cBody"></div>
    <div class="actions">
      <span id="cLink"></span>
      <div class="nav-btns"><button onclick="step(-1)">◂ prev</button><button onclick="step(1)">next ▸</button></div>
    </div>
  </article>
</div>

<script>
const N = [
  {id:"courtana",lane:"career",cls:"live",mono:"C",laneLabel:"Now shipping · live",title:"Courtana",period:"2023 → now · founder / CEO",
   one:"AI smart-court SaaS — 36 courts live or piloting, $350K raised.",
   pull:"AI smart-court tech for the people who actually run the room.",
   body:["Raised <em>$350K</em>; concept to <em>36 courts live or piloting</em>, anchored by a flagship with a 44-court expansion LOI. Computer vision, edge compute, instant highlights, AI coaching, Stripe — across 11+ sports.","Ran the full zero-to-one loop solo, on an AI-native build system that compressed iteration from weeks to days."],
   link:{u:"https://courtana.com",t:"courtana.com ↗"}},
  {id:"vibeco",lane:"side",gly:"⚙",laneLabel:"The engine · 2026",title:"VibeCo",period:"2026 · 11-agent product simulator",
   one:"The workshop behind 40+ apps across 31 repos.",
   pull:"The workshop the rest of these builds came out of.",
   body:["An 11-agent simulator that turns a plain-English idea into a brief, build prompts, and concept art — tool-calling, multi-model routing, a parallel critique “Thunderdome,” and a synthesis flywheel.","The reason one operator can go idea-to-proof in an afternoon."],
   link:{u:"https://vibeco.lovable.app/simulate",t:"run the simulator ↗"}},
  {id:"pickle",lane:"side",mono:"P",laneLabel:"The tech proof · 2026",title:"Pickle DaaS",period:"2026 · computer-vision rails",
   one:"4,097 clips analyzed at $0.0054 each.",
   pull:"Highlight intelligence at $0.0054 per clip.",
   body:["A 4,097-clip corpus at <em>$0.0054/clip</em> — ~7x cheaper than GPT-4o — into player-DNA profiles, brand-exposure registries, and coaching feedback, run by autonomous agents with spend caps and a ground-truth loop.","The model isn’t the moat — <em>the math is.</em>"],
   link:{u:"https://picklebill.github.io/pickle-daas-data/dashboards/showcase-portal-v4.html",t:"the dashboards ↗"}},
  {id:"walk",lane:"personal",gly:"↑",laneLabel:"The long walk",title:"The Long Walk",period:"2023 → now · still walking",
   one:"Cancer, 2023. The pipeline didn't stop. Neither did I.",
   pull:"Cancer, 2023. The pipeline didn’t stop. Neither did I.",
   body:["Diagnosed in 2023. Twelve weeks of chemo, most tolerable, a few not. The pipeline kept moving — partly because I wanted it to, partly because it didn’t care.","I leave this here because no one I’d want to work with would want me to leave it out — and because the operator instinct gets <em>ruthlessly clear</em> when the day is short. Still walking."],
   link:{u:"mailto:bricker3@gmail.com",t:"if this is your road too, write me ↗"}},
  {id:"dreamship",lane:"career",mono:"DS",laneLabel:"Build · the big one",title:"Dreamship",period:"2018–25 · cofounder &amp; CEO → board chair",
   one:"Zero to $35M+ — 11x in a single year. Sold Google.",
   pull:"Zero to $35M+ — and 11x in a single year.",
   body:["Led as CEO from zero to <em>$35M+ revenue</em>, ~$85M GMV, 2.3M+ units — including <em>11x growth in one year</em> — on $2.2M raised; EBITDA-profitable 4 of 8 years.","As a sub-one-year-old startup I personally sold <em>Google</em>: built an AI IP-compliance checker, drove it through 5–6 internal teams to director+ sign-off, unlocking an 8-figure channel that ran 5+ years — then sequenced Stripe, PayPal, Meta &amp; Payoneer off it.","Zero-to-one is a <em>posture</em>, not a phase you graduate from."],
   link:{u:"https://dreamship.com",t:"dreamship.com ↗"}},
  {id:"gear",lane:"career",mono:"GL",laneLabel:"Sell · 2017",title:"GearLaunch",period:"2017 · VP Sales &amp; Marketing",
   one:"Creator commerce, before it had a name.",
   pull:"Two years before everyone else said “creator economy.”",
   body:["VP Sales &amp; Marketing for a 360° ecommerce / print-on-demand platform. Tiny team, bespoke playbook — the proving ground for the operator muscle that ran Dreamship next."],link:null},
  {id:"gord",lane:"side",gly:"♠",laneLabel:"Play · 2016",title:"GroupOrDare",period:"2016 · party card game",
   one:"I shipped a party card game. It exists. It works.",
   pull:"I designed and shipped a party game. It exists. It works.",
   body:["Yes really. My kids think it’s the most impressive thing I’ve ever done, which is, on reflection, the correct ranking.","Evidence beats résumé — a bored idea followed all the way into the world is evidence."],link:null},
  {id:"manifesto",lane:"side",gly:"✎",laneLabel:"Field note · 2015",title:"The Networking Manifesto",period:"2015 · essay · still operative",
   one:"“Who can I introduce you to?” — the operating question.",
   pull:"“Who can I introduce you to so you can achieve your goals?”",
   body:["The one question I’ve asked at the top of nearly every working conversation for over a decade. The river of intros is the longest line on my career map and the highest-leverage asset class a working person owns."],link:null},
  {id:"wibi",lane:"career",mono:"Wd",laneLabel:"Sell · 2014",title:"WibiData",period:"2014 · Director of Sales",
   one:"F500 Big Data pilots — Macy's, Nordstrom.",
   pull:"Selling into a problem the customer hasn’t named yet.",
   body:["Structured Big Data pilots with <em>Macy’s</em>, <em>Nordstrom</em>, and other Fortune 500 retailers at an NEA/Canaan/Eric-Schmidt-backed startup. Selling into the <em>shape</em> of a problem the customer can’t fully name has shown up in every job since."],link:null},
  {id:"ibm",lane:"career",mono:"IBM",laneLabel:"Sell · the foundation",title:"IBM / Netezza",period:"2012–14 · seven-figure enterprise deals",
   one:"Zillow, Avalara, an 8-fig McKesson deal. &gt;100% quota.",
   pull:"You cannot out-build the need to talk to a customer.",
   body:["Closed high-six-figure analytics deals with <em>Zillow</em> and <em>Avalara</em>, contributed to an 8-figure McKesson deal, and finished above 100% of quota — selling Big Data into mid-market and Fortune 500 before AI made any of this easier.","Complicated things sell only when one human cares enough to make them simple for another."],
   link:{u:"work.html",t:"ask me about enterprise GTM →"}},
  {id:"unc",lane:"career",mono:"UNC",laneLabel:"Study · 2010",title:"UNC Kenan-Flagler",period:"2010 · MBA · GMAT 730",
   one:"Where activity stopped masquerading as progress.",
   pull:"Where I stopped confusing activity with progress.",
   body:["Two years to learn what a P&amp;L is for, and to meet the handful of people who’d show up on this map a dozen more times over the next fifteen years."],link:null},
  {id:"nwm",lane:"career",mono:"NM",laneLabel:"Origin · 2006",title:"Northwestern Mutual",period:"2006 · first job · cold-call school",
   one:"Doors and dials. Top 10 nationally, $6M+ TCV.",
   pull:"The most concentrated lesson in selling I ever got.",
   body:["Out of college: doors and dials. Ranked top 10 nationally, $6M+ total contract value across 150+ accounts — taught by a phone that mostly went to voicemail.","Grateful for it the way you’re grateful for a hard winter."],link:null},
  {id:"home",lane:"personal",gly:"♥",laneLabel:"Home base",title:"Home · three kids",period:"ongoing · the why",
   one:"The reason any of this matters.",
   pull:"The reason any of this matters.",
   body:["Three kids. A real kitchen and an unreal amount of pickleball gear in the garage. The whole climb exists to support this — not the other way around."],link:null},
];

const tl = document.getElementById('tl');
tl.innerHTML = N.map((n,i)=>{
  const side = i%2===0 ? 'r' : 'l';
  const emb = n.gly ? `<span class="gly">${n.gly}</span>` : `<span class="mono">${n.mono}</span>`;
  const live = n.cls==='live' ? '<span class="live-pill">live</span>' : '';
  return `<div class="row ${side}" data-i="${i}">
    <div class="med ${n.lane} ${n.cls||''}" data-i="${i}"><div class="ring">${emb}</div></div>
    <div class="stub" data-i="${i}">
      <div class="yr">${n.period.split('·')[0].trim()}${live}</div>
      <h3>${n.title}</h3>
      <div class="one">${n.one}</div>
      <span class="tap">read →</span>
    </div>
  </div>`;
}).join('');

let openI = null;
function openCard(i){
  const n = N[i]; if(!n) return; openI = i;
  document.getElementById('cE').innerHTML = n.gly ? `<span class="gly">${n.gly}</span>` : n.mono;
  document.getElementById('cLane').innerHTML = n.laneLabel;
  document.getElementById('cTitle').innerHTML = n.title;
  document.getElementById('cPeriod').innerHTML = n.period;
  document.getElementById('cPull').innerHTML = n.pull;
  document.getElementById('cBody').innerHTML = n.body.map(p=>`<p>${p}</p>`).join('');
  document.getElementById('cLink').innerHTML = n.link ? `<a class="lnk" href="${n.link.u}" ${n.link.u.startsWith('http')?'target="_blank" rel="noopener"':''}>${n.link.t}</a>` : '<span></span>';
  document.getElementById('scrim').classList.add('on');
}
function closeCard(){document.getElementById('scrim').classList.remove('on');openI=null}
function step(d){if(openI===null)return;openCard((openI+d+N.length)%N.length)}
window.closeCard=closeCard;window.step=step;
document.body.classList.remove('no-js');
document.querySelectorAll('[data-i]').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.i;if(!isNaN(i))openCard(i)}));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeCard();
  if(document.getElementById('scrim').classList.contains('on')){if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);}
});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.row').forEach(r=>io.observe(r));
</script>
</body>
</html>
